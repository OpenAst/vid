services:
  # Web Service (Django + Node.js)
  # Uses Supabase PostgreSQL, R2 Storage, and external Redis
  - type: web
    name: web-backend
    env: docker
    plan: starter
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO.git  # Replace with your repo URL
    dockerfilePath: Render.Dockerfile
    buildCommand: ""  # Let Dockerfile handle build
    startCommand: ""  # Let entrypoint.sh handle startup
    healthCheckPath: /api/
    envVars:
      # Django Settings
      - key: ENV
        value: "production"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      
      # Database - Supabase PostgreSQL
      - key: DATABASE_URL
        sync: false
        # Format: postgresql://user:password@db.supabase.co:5432/postgres
        # Get this from Supabase dashboard → Settings → Database
      
      # Redis (Internal connection to the redis service defined below)
      - key: REDIS_URL
        fromService:
          type: redis
          name: vid-redis
          property: connectionString
      
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: vid-redis
          property: connectionString
      
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: vid-redis
          property: connectionString
      
      # R2 Storage (Cloudflare)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      
      - key: AWS_STORAGE_BUCKET_NAME
        value: "your-bucket-name"
      
      - key: AWS_S3_ENDPOINT_URL
        value: "https://your-account-id.r2.cloudflarestorage.com"
      
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      
      # Frontend URLs
      - key: ALLOWED_HOSTS
        value: "your-service.render.com,yourdomain.com"
      
      - key: FRONTEND_DOMAIN
        value: "your-frontend-domain.com"
      
      - key: FRONTEND_URL
        value: "https://your-frontend-domain.com"
      
      - key: FRONTEND_PROTOCOL
        value: "https"
      
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-domain.com,http://localhost:3000"
      
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-frontend-domain.com,https://your-service.render.com"
      
      # Email (SendGrid or your provider)
      - key: EMAIL_BACKEND
        value: "sendgrid_backend.SendgridBackend"
      
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@yourdomain.com"
      
      - key: EMAIL_HOST_USER
        sync: false
      
      # Google OAuth (Optional)
      - key: SOCIAL_AUTH_GOOGLE_OAUTH2_KEY
        sync: false
      
      - key: SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET
        sync: false
      
      # Database Settings (if using manual config instead of DATABASE_URL)
      - key: USE_DATABASE_URL
        value: "true"
    
    autoDeploy: true
    regions:
      - oregon

  - type: redis
    name: vid-redis
    plan: free # or starter
    ipAllowList: [] # empty means only internal access
