services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      PRIMARY_FRONTEND_URL: ${PRIMARY_FRONTEND_URL}
      API_BASE_URL: ${API_BASE_URL}
      USE_DATABASE_URL: "True"
      DATABASE_URL: ${DATABASE_URL}
      REALTIME_SERVER_INTERNAL_URL: http://realtime:4000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      SOCIAL_AUTH_ALLOWED_REDIRECT_URIS: ${SOCIAL_AUTH_ALLOWED_REDIRECT_URIS}
      SOCIAL_AUTH_REDIRECT_IS_HTTPS: "True"
      SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${SOCIAL_AUTH_GOOGLE_OAUTH2_KEY}
      SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN}
    expose:
      - "8000"

  realtime:
    build:
      context: ./realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DJANGO_API_URL: http://backend:8000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
    depends_on:
      - backend
    expose:
      - "4000"
