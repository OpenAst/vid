services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      PRIMARY_FRONTEND_URL: ${PRIMARY_FRONTEND_URL}
      API_BASE_URL: ${API_BASE_URL}
      USE_DATABASE_URL: "True"
      DATABASE_URL: ${DATABASE_URL}
      REALTIME_SERVER_INTERNAL_URL: http://realtime:4000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET}
      SECURE_SSL_REDIRECT: "False"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      SOCIAL_AUTH_ALLOWED_REDIRECT_URIS: ${SOCIAL_AUTH_ALLOWED_REDIRECT_URIS}
      SOCIAL_AUTH_REDIRECT_IS_HTTPS: "True"
      SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${SOCIAL_AUTH_GOOGLE_OAUTH2_KEY}
      SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN}
      TURN_SERVER_URLS: ${TURN_SERVER_URLS:-stun:localhost:3478,turn:localhost:3478}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-local-turn-secret}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
    expose:
      - "8000"

  realtime:
    build:
      context: ./realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DJANGO_API_URL: http://backend:8000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    expose:
      - "4000"

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-local-turn-secret}
      - --realm=${TURN_REALM:-localhost}
      - --no-multicast-peers
      - --no-loopback-peers
      - --min-port=49152
      - --max-port=49200
      - --verbose
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"

volumes:
  redis_data:
