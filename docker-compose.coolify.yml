services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend-environment
      ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      PRIMARY_FRONTEND_URL: ${PRIMARY_FRONTEND_URL}
      API_BASE_URL: ${API_BASE_URL}
      USE_DATABASE_URL: "True"
      DATABASE_URL: ${DATABASE_URL}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      CELERY_BROKER_CONNECTION_TIMEOUT: "3"
      REALTIME_SERVER_INTERNAL_URL: http://realtime:4000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET}
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_IDENTIFIER_ATTEMPTS: ${LOGIN_RATE_LIMIT_IDENTIFIER_ATTEMPTS:-8}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      OAUTH_START_RATE_LIMIT_IP_ATTEMPTS: ${OAUTH_START_RATE_LIMIT_IP_ATTEMPTS:-30}
      OAUTH_START_RATE_LIMIT_WINDOW_SECONDS: ${OAUTH_START_RATE_LIMIT_WINDOW_SECONDS:-900}
      VOICE_TRANSCRIPTION_ENABLED: ${VOICE_TRANSCRIPTION_ENABLED:-False}
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-openai}
      VOICE_TRANSCRIPTION_LANGUAGE: ${VOICE_TRANSCRIPTION_LANGUAGE:-}
      VOICE_TRANSCRIPTION_MAX_AUDIO_BYTES: ${VOICE_TRANSCRIPTION_MAX_AUDIO_BYTES:-26214400}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      SECURE_SSL_REDIRECT: "False"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      SOCIAL_AUTH_ALLOWED_REDIRECT_URIS: ${SOCIAL_AUTH_ALLOWED_REDIRECT_URIS}
      SOCIAL_AUTH_REDIRECT_IS_HTTPS: "True"
      SOCIAL_AUTH_GOOGLE_OAUTH2_KEY: ${SOCIAL_AUTH_GOOGLE_OAUTH2_KEY}
      SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET: ${SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET}
      EMAIL_BACKEND: ${EMAIL_BACKEND}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN}
      TURN_SERVER_URLS: ${TURN_SERVER_URLS:-stun:localhost:3478,turn:localhost:3478}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-local-turn-secret}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
    depends_on:
      - redis
    expose:
      - "8000"

  celery:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A backend worker -l info
    environment: *backend-environment
    depends_on:
      - backend
      - redis

  realtime:
    build:
      context: ./realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DJANGO_API_URL: http://backend:8000
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    expose:
      - "4000"

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - -n
      - --listening-port=3478
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-local-turn-secret}
      - --realm=${TURN_REALM:-localhost}
      - --min-port=49152
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"

volumes:
  redis_data:
