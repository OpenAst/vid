<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        padding: 0;
        background: #f3f4f6;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        padding: 40px 16px;
      }

      .container {
        background: #ffffff;
        padding: 36px;
        border-radius: 24px;
        max-width: 560px;
        margin: auto;
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .brand {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7c3aed;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 0 14px;
        color: #475569;
        font-size: 16px;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        background: linear-gradient(135deg, #6d28d9, #4f46e5);
        color: white;
        padding: 14px 24px;
        margin-top: 12px;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(79, 70, 229, 0.24);
      }

      .meta {
        margin-top: 24px;
        font-size: 13px;
        color: #94a3b8;
      }

      .divider {
        height: 1px;
        background: #e2e8f0;
        margin: 28px 0;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="container">
        <div class="brand">{{ site_name|default:"OneClyq" }}</div>
        <h1>Activate your account</h1>
        <p>Welcome aboard. One last step and your account will be ready to use.</p>
        <a href="{{ url }}" class="button">Activate account</a>
        <div class="divider"></div>
        <p class="meta">
          If you did not create a {{ site_name|default:"OneClyq" }} account, you can safely ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
